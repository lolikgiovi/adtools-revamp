<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD Tools</title>
    <link rel="icon" type="image/x-icon" href="../tauri/icons/128x128@2x.png">
    <!-- Prevent flash of wrong theme by applying class before CSS loads -->
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme && theme !== 'light') {
                document.documentElement.classList.add(theme);
            }
            document.documentElement.setAttribute('data-theme', theme || 'light');
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- React's SidebarProvider Concept equivalent -->
    <div class="sidebar-provider" data-sidebar="sidebar">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation" data-state="expanded">
            <!-- SidebarHeader -->
            <div class="sidebar-header">
                <div class="sidebar-header-content">
                    <h2 class="sidebar-title">AD Tools</h2>
                </div>
            </div>

            <!-- SidebarContent -->
            <div class="sidebar-content">
                <!-- Category groups are generated dynamically by Sidebar.renderTools() based on tools.json -->
            </div>

            <!-- SidebarFooter -->
            <div class="sidebar-footer">
                <div class="sidebar-menu" data-group="footer">
                    <!-- Footer items rendered dynamically by Sidebar.renderMenuGroups() -->
                </div>
            </div>

        </aside>

        <!-- Main content with SidebarTrigger -->
        <main class="main">
            <!-- Header with SidebarTrigger, Breadcrumb, and Actions -->
            <header class="main-header" data-runtime="web">
                <div class="header-context">
                    <button class="sidebar-trigger" aria-label="Toggle sidebar">
                        <svg class="sidebar-trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="18" x="3" y="3" rx="2" />
                            <path d="M9 3v18" />
                        </svg>
                    </button>

                    <!-- Breadcrumb Navigation -->
                    <nav class="breadcrumb" aria-label="Breadcrumb">
                        <ol class="breadcrumb-list">
                            <li class="breadcrumb-item">
                                <a href="#" class="breadcrumb-link" id="breadcrumb-home">AD Tools</a>
                            </li>
                            <li class="breadcrumb-separator" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="9,18 15,12 9,6" />
                                </svg>
                            </li>
                            <li class="breadcrumb-item breadcrumb-current" aria-current="page">
                                <span id="breadcrumb-current">Home</span>
                            </li>
                        </ol>
                    </nav>
                </div>

                <!-- Header actions (right side) -->
                <div class="header-actions">
                    <button class="header-search" type="button" aria-label="Search tools, pages, and Quick Query schemas">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" />
                            <path d="m20 20-4-4" />
                        </svg>
                        <span>Search...</span>
                        <kbd>⌘K</kbd>
                    </button>
                </div>
            </header>

            <div class="main-content">
                <!-- Content will be dynamically loaded by App.js -->
            </div>
        </main>
    </div>


    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" data-state="closed"></div>

    <!-- Main App (ESM) -->
    <script type="module">
        import { App } from './App.js';
        // Initialize the modular app and expose globally after creation
        document.addEventListener('DOMContentLoaded', () => {
            const app = new App();
            window.app = app;
        });
    </script>
</body>

</html>
