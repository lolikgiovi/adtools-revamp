<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD Tools</title>
    <meta name="application-name" content="AD Tools">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AD Tools">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="../tauri/icons/128x128@2x.png">
    <!-- Prevent flash of wrong theme by applying class before CSS loads -->
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme && theme !== 'light') {
                document.documentElement.classList.add(theme);
            }
            document.documentElement.setAttribute('data-theme', theme || 'light');
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Desktop toolbar: navigation, global search, and actions -->
    <div class="window-titlebar" data-tauri-drag-region>
        <div class="window-titlebar-leading" data-tauri-drag-region></div>
        <div class="window-titlebar-center" data-tauri-drag-region></div>
        <div class="window-titlebar-actions" data-tauri-drag-region>
            <div data-tauri-drag-region class="connection-indicators" aria-label="Connection activity">
                <div data-tauri-drag-region class="connection-indicator-group">
                    <button class="connection-indicator" data-connection="oracle" data-state="idle" type="button"
                        aria-label="Oracle connections" title="Oracle connections"
                        aria-expanded="false" aria-controls="oracle-connection-menu" aria-haspopup="true">
                        <span class="connection-dot" aria-hidden="true"></span><span class="connection-name">Oracle</span>
                        <svg class="connection-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="m6 9 6 6 6-6" />
                        </svg>
                    </button>
                    <div class="connection-menu app-popover-surface" id="oracle-connection-menu" hidden></div>
                </div>
                <div data-tauri-drag-region class="connection-indicator-group">
                    <button class="connection-indicator" data-connection="kafka" data-state="idle" type="button"
                        aria-label="Kafka connections" title="Kafka connections"
                        aria-expanded="false" aria-controls="kafka-connection-menu" aria-haspopup="true">
                        <span class="connection-dot" aria-hidden="true"></span><span class="connection-name">Kafka</span>
                        <svg class="connection-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="m6 9 6 6 6-6" />
                        </svg>
                    </button>
                    <div class="connection-menu app-popover-surface" id="kafka-connection-menu" hidden></div>
                </div>
                <div data-tauri-drag-region class="connection-indicator-group">
                    <button class="connection-indicator" data-connection="redis" data-state="idle" type="button"
                        aria-label="Redis connections" title="Redis connections"
                        aria-expanded="false" aria-controls="redis-connection-menu" aria-haspopup="true">
                        <span class="connection-dot" aria-hidden="true"></span><span class="connection-name">Redis</span>
                        <svg class="connection-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="m6 9 6 6 6-6" />
                        </svg>
                    </button>
                    <div class="connection-menu app-popover-surface" id="redis-connection-menu" hidden></div>
                </div>
                <button class="connection-indicator feedback-trigger" type="button" aria-haspopup="dialog" aria-controls="feedback-dialog">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z" />
                    </svg>
                    <span>Feedback</span>
                </button>
            </div>
        </div>
    </div>

    <!-- React's SidebarProvider Concept equivalent -->
    <div class="sidebar-provider" data-sidebar="sidebar">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation" data-state="expanded">
            <!-- SidebarHeader -->
            <div class="sidebar-header"></div>

            <!-- SidebarContent -->
            <div class="sidebar-content">
                <!-- Category groups are generated dynamically by Sidebar.renderTools() based on tools.json -->
            </div>

            <!-- SidebarFooter -->
            <div class="sidebar-footer">
                <div class="sidebar-menu" data-group="footer">
                    <!-- Footer items rendered dynamically by Sidebar.renderMenuGroups() -->
                </div>
            </div>

        </aside>

        <!-- Main content with SidebarTrigger -->
        <main class="main">
            <!-- Header with SidebarTrigger, Breadcrumb, and Actions -->
            <header class="main-header" data-runtime="web">
                <div class="header-context">
                    <button class="sidebar-trigger" aria-label="Toggle sidebar">
                        <svg class="sidebar-trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="18" x="3" y="3" rx="2" />
                            <path d="M9 3v18" />
                        </svg>
                    </button>

                    <!-- Breadcrumb Navigation -->
                    <nav data-tauri-drag-region class="breadcrumb" aria-label="Breadcrumb">
                        <ol data-tauri-drag-region class="breadcrumb-list">
                            <li data-tauri-drag-region class="breadcrumb-item">
                                <a href="#" class="breadcrumb-link" id="breadcrumb-home">Home</a>
                            </li>
                            <li data-tauri-drag-region class="breadcrumb-separator" aria-hidden="true">
                                <svg data-tauri-drag-region viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline data-tauri-drag-region points="9,18 15,12 9,6" />
                                </svg>
                            </li>
                            <li data-tauri-drag-region class="breadcrumb-item breadcrumb-current" aria-current="page">
                                <span data-tauri-drag-region id="breadcrumb-current">Home</span>
                            </li>
                        </ol>
                    </nav>
                </div>

                <div class="header-center">
                    <button class="header-search" type="button" aria-label="Search tools, pages, tables, and PlantUML files"
                        title="Search schema.table, table names, and PlantUML filenames — no prefix needed">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" />
                            <path d="m20 20-4-4" />
                        </svg>
                        <span>Search</span>
                        <kbd>⌘K</kbd>
                    </button>
                </div>
                <!-- Header actions move together into the native desktop title bar. -->
                <div data-tauri-drag-region class="header-actions"></div>
            </header>

            <div class="main-content">
                <!-- Content will be dynamically loaded by App.js -->
            </div>
        </main>
    </div>


    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay app-overlay-backdrop" data-state="closed"></div>

    <!-- Main App (ESM) -->
    <script type="module">
        import { App } from './App.js';
        // Initialize the modular app and expose globally after creation
        document.addEventListener('DOMContentLoaded', () => {
            const app = new App();
            window.app = app;
        });
    </script>
</body>

</html>
