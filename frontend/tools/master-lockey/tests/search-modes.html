<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Master Lockey search verification</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        display: block;
        height: 100vh;
        padding: 20px;
        overflow: auto;
      }
      #fixture-controls {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }
      #fixture {
        height: calc(100vh - 100px);
      }
      #fixture.narrow {
        max-width: 620px;
      }
    </style>
  </head>
  <body>
    <div id="fixture-controls">
      <button id="load">Load sample data</button>
      <button id="large">Load 5,000 rows</button>
      <button id="empty">Empty state</button>
      <button id="narrow">Toggle narrow layout</button>
    </div>
    <output id="clipboard-output" aria-label="Copied text"></output>
    <main id="fixture"></main>
    <script type="module">
      import { MasterLockey } from "../main.js";
      import { enhanceSearchableDropdowns } from "../../../components/SearchableDropdown.js";
      import { UsageTracker } from "../../../core/UsageTracker.js";
      UsageTracker.trackEvent = () => {};
      UsageTracker.trackToolUse = () => {};
      Object.defineProperty(navigator, "clipboard", {
        value: {
          async writeText(value) {
            document.querySelector("#clipboard-output").textContent = value;
          },
        },
      });
      const tool = new MasterLockey({ on() {}, emit() {} });
      tool.container = document.createElement("div");
      tool.container.className = "tool-root";
      document.querySelector("#fixture").appendChild(tool.container);
      tool.container.innerHTML = tool.render();
      const domains = tool.container.querySelector("#domain-selector");
      ["uat1", "uat2", "uat3"].forEach((domain) => {
        domains.add(new Option(domain, JSON.stringify({ key: domain, value: "https://example.invalid" })));
      });
      enhanceSearchableDropdowns(tool.container);
      tool.bindElements();
      tool.setupEventListeners();
      tool.setupTabListeners();
      document.querySelector("#load").onclick = () => {
        tool.parsedData = {
          languagePackId: "sample",
          languages: ["en", "id"],
          rows: [
            { key: "welcomeTitle", en: "Welcome", id: "Selamat datang" },
            { key: "continueButton", en: "Continue", id: "Lanjut" },
          ],
        };
        tool.els.errorState.style.display = "none";
        tool.displayData();
      };
      document.querySelector("#large").onclick = () => {
        tool.parsedData = {
          languagePackId: "large-sample",
          languages: ["en", "id"],
          rows: Array.from({ length: 5000 }, (_, index) => ({
            key: `key${String(index).padStart(5, "0")}`,
            en: index % 5 === 0 ? "Long content ".repeat(40) : `Content ${index}`,
            id: `Konten ${index}`,
          })),
        };
        tool.displayData();
      };
      document.querySelector("#empty").onclick = () => {
        tool.parsedData = null;
        tool.setSearchEnabled(false);
        tool.els.emptyState.style.display = "flex";
        tool.els.tableContainer.style.display = "none";
        tool.els.resultsCount.style.display = "none";
        tool.els.infoVersion.style.display = "none";
      };
      document.querySelector("#narrow").onclick = () => document.querySelector("#fixture").classList.toggle("narrow");
    </script>
  </body>
</html>
