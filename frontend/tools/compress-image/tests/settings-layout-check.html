<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Settings layout check</title>
  </head>
  <body>
    <iframe title="Mobile settings" src="./layout.html?sample" style="width: 390px; height: 1000px; border: 0"></iframe>
    <pre id="result">Running</pre>
    <script type="module">
      const frame = document.querySelector("iframe");
      await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
      const doc = frame.contentDocument;
      const readyBy = performance.now() + 10000;
      while (doc.querySelector("[data-ci=png-settings]").disabled) {
        if (performance.now() > readyBy) throw new Error("Sample PNG did not become ready");
        await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
      }
      doc.querySelector("[data-ci=resize]").click();
      const mode = doc.querySelector("[data-ci=png-mode]");
      mode.value = "lossy";
      mode.dispatchEvent(new Event("change", { bubbles: true }));
      await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
      const selectors = [
        ".ci-settings",
        "[data-ci=all-settings]",
        ".ci-toggle",
        "[data-ci=bounds]",
        "[data-ci=width]",
        "[data-ci=height]",
        ".ci-advice",
      ];
      const measurements = selectors.map((selector) => {
        const element = doc.querySelector(selector);
        return {
          selector,
          rect: element.getBoundingClientRect().toJSON(),
          columns: frame.contentWindow.getComputedStyle(element).gridTemplateColumns,
        };
      });
      const visibleFields = [...doc.querySelectorAll(".ci-settings input[type=number], .ci-settings select")];
      if (visibleFields.some((field) => field.getBoundingClientRect().top <= field.parentElement.getBoundingClientRect().top)) {
        throw new Error("A field label is not above its input");
      }
      if (doc.documentElement.scrollWidth > 390) throw new Error("Mobile page overflows");
      if (doc.querySelector("[data-ci=png-quality]").hidden) throw new Error("PNG quality fields are hidden");
      document.querySelector("#result").textContent =
        "PASS: mobile fields fit, labels sit above inputs, and expanded PNG quality is visible.\n" + JSON.stringify(measurements, null, 2);
    </script>
  </body>
</html>
