<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compress Image responsive review</title>
    <style>
      body {
        margin: 0;
        background: #e4e4e7;
      }
      iframe {
        display: block;
        border: 0;
        width: 390px;
        height: 1550px;
        background: white;
      }
    </style>
  </head>
  <body>
    <iframe src="./browser.html" title="390 pixel mobile viewport"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const frame = document.querySelector("iframe");
      const width = ["768", "1536", "2394"].includes(params.get("width")) ? Number(params.get("width")) : 390;
      frame.style.width = `${width}px`;
      frame.title = `${width} pixel viewport`;
      frame.src = params.has("layout")
        ? `./layout.html?${params.has("sample") ? "sample" : ""}${params.has("processed") ? "&processed" : ""}`
        : `./browser.html?theme=${params.get("theme") === "dark" ? "dark" : "light"}`;
      if (params.has("layout")) {
        frame.style.height = `${Math.round(window.innerHeight / Math.min(1, window.innerWidth / width))}px`;
        frame.style.transformOrigin = "top left";
        frame.style.transform = `scale(${Math.min(1, window.innerWidth / width)})`;
        document.body.style.overflow = "hidden";
      }
    </script>
  </body>
</html>
