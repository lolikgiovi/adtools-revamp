<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compress Image responsive review</title>
    <style>
      body {
        margin: 0;
        background: #e4e4e7;
      }
      iframe {
        display: block;
        border: 0;
        width: 390px;
        height: 1550px;
        background: white;
      }
    </style>
  </head>
  <body>
    <iframe src="./browser.html" title="390 pixel mobile viewport"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const frame = document.querySelector("iframe");
      const width = params.get("width") === "768" ? 768 : 390;
      frame.style.width = `${width}px`;
      frame.title = `${width} pixel viewport`;
      frame.src = `./browser.html?theme=${params.get("theme") === "dark" ? "dark" : "light"}`;
    </script>
  </body>
</html>
