<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML notification validation checks</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
      }
      #results {
        font: 13px/1.5 system-ui;
      }
      .pass {
        color: #58c894;
      }
      .fail {
        color: #f77;
      }
      body {
        height: 100dvh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      body > details {
        flex: 0 0 auto;
      }
      .fixture-header {
        flex: 0 0 70px;
      }
      main {
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <details>
      <summary>Browser verification results</summary>
      <ol id="results"></ol>
    </details>
    <div class="fixture-header" aria-hidden="true"></div>
    <main class="main-content"><div class="tool-root"></div></main>
    <script type="module">
      import "../../velocity-template/styles.css";
      import { HTMLTemplateTool } from "../main.js";
      import { OracleConnectionService } from "../../../core/OracleConnectionService.js";
      import { UsageTracker } from "../../../core/UsageTracker.js";
      for (const key of ["trackEvent", "trackToolUse", "trackFeature"]) UsageTracker[key] = () => {};
      const results = document.querySelector("#results");
      const check = (condition, label) => {
        const row = document.createElement("li");
        row.className = condition ? "pass" : "fail";
        row.textContent = `${condition ? "PASS" : "FAIL"}: ${label}`;
        results.append(row);
        if (!condition) throw new Error(label);
      };
      const settle = () => new Promise((resolve) => setTimeout(resolve, 400));
      const key = "config.velocityValidator.notificationUrl";
      const previous = localStorage.getItem(key);
      const paneKey = "tool:html-template:pane-state";
      const previousPane = localStorage.getItem(paneKey);
      localStorage.removeItem(paneKey);
      const originalFetch = window.fetch;
      const requests = [];
      let failNext = false;
      let release;
      window.fetch = async (url, options) => {
        if (String(url) !== "http://localhost/notification-fixture") return originalFetch(url, options);
        requests.push(JSON.parse(options.body));
        if (release === "hold")
          return new Promise((resolve) => {
            release = resolve;
          });
        const status = failNext ? 503 : 200;
        return new Response(status === 200 ? "<h1>API: Rp60.000</h1>" : "API unavailable", { status });
      };
      localStorage.setItem(key, "http://localhost/notification-fixture");
      try {
        const tool = new HTMLTemplateTool();
        const records = new Map();
        tool.initializeDocuments = async () => {
          tool.documentStore = {
            saveDocument: async (record) => records.set(record.id, structuredClone(record)),
            saveWorkspace: async () => {},
            saveWorkspaceAndDocument: async (record) => records.set(record.id, structuredClone(record)),
            close: () => {},
          };
          tool.documents = [
            tool.createDocumentModel({
              id: "notification-one",
              name: "Notification",
              html: "<h1>$format.currency($amount)</h1>",
              vtlValues: { amount: 60000 },
              createdAt: Date.now(),
            }),
          ];
          tool.activeDocumentId = tool.documents[0].id;
          tool.vtlValues = tool.activeDocument.vtlValues;
          tool.renderDocumentTabs();
          return tool.documents;
        };
        tool.container = document.querySelector(".tool-root");
        tool.container.innerHTML = tool.render();
        await tool.onMount();
        const find = (selector) => tool.container.querySelector(selector);
        const input = (text) => {
          tool.contextEditor.setValue(text);
        };
        check(
          find("#htmlVelocityContext").getBoundingClientRect().top > find("#htmlEditor").getBoundingClientRect().top,
          "Velocity Context sits below HTML Template",
        );
        const reference = document.createElement("div");
        reference.className = "velocity-template-tool";
        reference.hidden = true;
        reference.innerHTML =
          '<div class="pane-header vtl-compact-header"><h3>Reference</h3><button class="btn btn-secondary btn-sm">Reference</button></div>';
        document.body.append(reference);
        const compareStyles = (actual, expected, properties) =>
          properties.every(
            (property) => getComputedStyle(actual).getPropertyValue(property) === getComputedStyle(expected).getPropertyValue(property),
          );
        check(
          compareStyles(find(".html-source-pane > .pane-header"), reference.querySelector(".pane-header"), [
            "padding-top",
            "padding-left",
            "min-height",
            "column-gap",
          ]),
          "Header spacing matches Velocity Template",
        );
        check(
          compareStyles(find("#btnSaveAsHtml"), reference.querySelector("button"), [
            "padding-top",
            "padding-left",
            "min-height",
            "font-size",
            "line-height",
            "background-color",
            "border-radius",
          ]),
          "Button density and styling match Velocity Template",
        );
        check(
          compareStyles(find("#htmlTemplateTitle"), reference.querySelector("h3"), ["font-size", "line-height"]),
          "Header typography matches Velocity Template",
        );
        reference.remove();
        const source = tool.editor.getValue();
        check(
          !find("#btnHtmlValidatorSettings") && find("#btnValidateHtmlVelocity").textContent === "Validate",
          "Render toolbar has Validate and no Settings",
        );
        check(tool.contextEditor.getModel().getLanguageId() === "json", "Velocity Context uses Monaco JSON");
        const sourceActions = [...find(".html-source-actions").children].filter((item) => !item.hidden);
        check(
          sourceActions[0].matches("details") &&
            sourceActions[0].querySelector("#btnImportHtml") &&
            sourceActions[1].classList.contains("html-workspace-tabs") &&
            sourceActions[2].id === "btnSaveAsHtml" &&
            sourceActions[3].id === "btnCreateHtmlQuery",
          "Source toolbar keeps Import, mode, Export, Create Query order",
        );
        const originalPicker = window.showSaveFilePicker;
        let exported;
        try {
          window.showSaveFilePicker = async () => ({
            name: "notification.vm",
            createWritable: async () => ({
              write: async (value) => {
                exported = value;
              },
              close: async () => {},
            }),
          });
          find("#btnSaveAsHtml").click();
          await settle();
          check(exported === source, "Export preserves the source with a custom file extension");
        } finally {
          window.showSaveFilePicker = originalPicker;
        }
        tool.editor.setValue(Array.from({ length: 400 }, (_, i) => `<p>Long notification line ${i}</p>`).join("\n"));
        find("#btnCollapseHtmlContext").click();
        await settle();
        const viewportFits = () => {
          const root = find(".html-template").getBoundingClientRect();
          const main = document.querySelector("main").getBoundingClientRect();
          const context = find(".html-context-pane").getBoundingClientRect();
          return root.bottom <= main.bottom + 1 && main.bottom <= innerHeight + 1 && context.bottom <= main.bottom + 1;
        };
        check(viewportFits(), "Long template and collapsed context stay inside the available viewport");
        find("#btnCollapseHtmlContext").click();
        await settle();
        check(viewportFits(), "Expanded panels stay inside the available viewport");
        const shellHeight = document.body.style.height;
        document.body.style.height = "420px";
        await settle();
        check(viewportFits(), "Expanded panels fit a shorter application area");
        find("#btnCollapseHtmlContext").click();
        await settle();
        check(viewportFits(), "Collapsed context remains reachable in a shorter application area");
        find("#btnCollapseHtmlContext").click();
        document.body.style.height = shellHeight;
        await settle();
        tool.editor.setValue(source);
        const panels = find("#htmlDocumentPanel");
        check(
          find(".html-context-pane").parentElement === panels && find(".html-source-pane").parentElement === panels,
          "Template and context have separate containers",
        );
        find("#btnCollapseHtmlTemplate").click();
        await settle();
        check(
          find("#btnCollapseHtmlTemplate").getAttribute("aria-expanded") === "false" &&
            find("#htmlEditor").getBoundingClientRect().height === 0 &&
            find("#htmlVelocityContext").getBoundingClientRect().height > 0,
          "Collapse template gives context the space",
        );
        find("#btnCollapseHtmlContext").click();
        await settle();
        check(
          find("#btnCollapseHtmlTemplate").getAttribute("aria-expanded") === "true" &&
            find("#htmlVelocityContext").getBoundingClientRect().height === 0 &&
            find("#htmlEditor").getBoundingClientRect().height > 0,
          "Collapse context expands template",
        );
        tool.initializePaneState();
        check(find("#btnCollapseHtmlContext").getAttribute("aria-expanded") === "false", "Collapsed pane preference restores");
        find("#btnCollapseHtmlContext").click();
        await settle();
        check(
          find("#htmlEditor").getBoundingClientRect().height > 0 && find("#htmlVelocityContext").getBoundingClientRect().height > 0,
          "Expand restores both panels",
        );
        find("#htmlModeEncoding").click();
        await settle();
        check(
          find("#htmlEditor").getBoundingClientRect().height > 0 && find("#htmlVelocityContext").getBoundingClientRect().height === 0,
          "Encoding keeps template accessible",
        );
        find("#htmlModeEdit").click();
        if (previousPane === null) localStorage.removeItem(paneKey);
        else localStorage.setItem(paneKey, previousPane);
        input('{"amount":');
        find("#btnValidateHtmlVelocity").click();
        await settle();
        check(requests.length === 0 && !find("#htmlVelocityContextError").hidden, "Invalid JSON stays local");
        await tool.duplicateDocument("notification-one");
        check(tool.contextEditor.getValue() === '{"amount":', "Duplicate preserves unfinished context");
        await tool.switchDocument("notification-one");
        check(tool.contextEditor.getValue() === '{"amount":', "Tab switch restores unfinished context");
        check(records.get("notification-one").contextText === '{"amount":', "Document save retains context draft");
        input('{"amount":60000}');
        find("#btnFormatHtmlContext").click();
        check(tool.contextEditor.getValue().includes("\n"), "Format JSON works");
        find("#btnValidateHtmlVelocity").click();
        await settle();
        check(
          requests[0].isAddFunction === true &&
            requests[0].context.amount === 60000 &&
            requests[0].template === "<h1>$format.currency($amount)</h1>",
          "Notification JSON payload includes isAddFunction=true",
        );
        check(
          find("#htmlRenderer").srcdoc === "<h1>API: Rp60.000</h1>" && tool.editor.getValue() === "<h1>$format.currency($amount)</h1>",
          "API result previews without replacing source",
        );
        check(
          find("#htmlValidationOutput").hidden && !find("#htmlValidationOutput").open,
          "Successful API HTML gets the preview without a raw response panel",
        );
        failNext = true;
        find("#btnValidateHtmlVelocity").click();
        await settle();
        check(
          find("#htmlValidationStatus").textContent.includes("503") && find("#htmlValidationResponse").textContent === "API unavailable",
          "HTTP failures retain API diagnostics",
        );
        failNext = false;
        release = "hold";
        find("#btnValidateHtmlVelocity").click();
        find("#btnValidateHtmlVelocity").click();
        check(requests.length === 3, "Repeated click makes one pending request");
        input('{"amount":10}');
        release(new Response("stale", { status: 200 }));
        release = null;
        await settle();
        check(find("#htmlRenderer").srcdoc !== "stale", "Edited inputs reject late responses");
        input('{"amount":60000}');
        find("#btnValidateHtmlVelocity").click();
        await settle();
        const oracleKey = "config.oracle.connections";
        const queryKey = "tool:html-template:import-queries";
        const priorOracle = localStorage.getItem(oracleKey);
        const priorQueries = localStorage.getItem(queryKey);
        const originalQuery = OracleConnectionService.queryViaSidecar;
        const originalApp = window.app;
        try {
          localStorage.setItem(oracleKey, JSON.stringify([{ name: "Fixture", connect_string: "fixture" }]));
          OracleConnectionService.queryViaSidecar = async () => ({
            columns: ["TEMPLATE_ID", "HTML_CONTENT"],
            rows: [["1", "<h1>$name</h1>"]],
          });
          find("#btnImportVelocitySql").hidden = false;
          find("#btnImportVelocitySql").click();
          tool._sqlImportEditor.setValue("SELECT * FROM DEMO.NOTIFICATION_TEMPLATE WHERE TEMPLATE_ID = 1");
          find("#btnFetchVelocitySql").click();
          await settle();
          find("#velocitySqlField").value = "1";
          find("#velocitySqlField").dispatchEvent(new Event("change"));
          find("#btnApplyVelocitySqlImport").click();
          await settle();
          check(
            tool.editor.getValue() === "<h1>$name</h1>" && !find("#btnCreateHtmlQuery").disabled,
            "SQL import selects HTML field and enables Create Query",
          );
          check(
            records.get(tool.activeDocumentId).sourceIdentity.templateColumn === "HTML_CONTENT",
            "Imported SQL identity persists with the document",
          );
          let handoff;
          window.app = {
            router: {
              navigate: (target, data) => {
                handoff = { target, data };
              },
            },
          };
          find("#btnCreateHtmlQuery").click();
          check(
            handoff.target === "quick-query" && handoff.data.createQuery.inputData[1].includes("<h1>$name</h1>"),
            "Create Query passes the current HTML to Quick Query",
          );
          find("#btnSyncHtmlContext").click();
          check(
            !find("#velocitySyncDialog").hidden && find("#velocitySyncFields").textContent.includes("name"),
            "Missing context fields open a review",
          );
          find("#btnApplyVelocitySync").click();
          check(Object.hasOwn(JSON.parse(tool.contextEditor.getValue()), "name"), "Review applies missing fields into Monaco context");
          await tool.switchDocument("notification-one");
          check(find("#btnCreateHtmlQuery").disabled, "File-only document does not inherit SQL identity");
          tool.contextEditor.executeEdits("fixture", [
            { range: tool.contextEditor.getModel().getFullModelRange(), text: '{"amount":61000}' },
          ]);
          const sourceContext = tool.contextEditor.getValue();
          await tool.newDocument("Undo isolation", "<p>Undo context</p>");
          tool.contextEditor.executeEdits("fixture", [
            { range: tool.contextEditor.getModel().getFullModelRange(), text: '{"other":true}' },
          ]);
          tool.contextEditor.trigger("fixture", "undo", null);
          check(!tool.contextEditor.getValue().includes("amount"), "Context undo stays within the active document");
          await tool.switchDocument("notification-one");
          check(tool.contextEditor.getValue() === sourceContext, "Switching back restores the original context edits");
          input('{"amount":60000}');
        } finally {
          OracleConnectionService.queryViaSidecar = originalQuery;
          window.app = originalApp;
          if (priorOracle === null) localStorage.removeItem(oracleKey);
          else localStorage.setItem(oracleKey, priorOracle);
          if (priorQueries === null) localStorage.removeItem(queryKey);
          else localStorage.setItem(queryKey, priorQueries);
        }
        await tool.notificationValidation.validate();
        document.title = "PASS: HTML notification validation";
      } catch (error) {
        const row = document.createElement("li");
        row.className = "fail";
        row.textContent = error.stack;
        results.append(row);
        document.title = "FAIL: HTML notification validation";
      } finally {
        if (previousPane === null) localStorage.removeItem(paneKey);
        else localStorage.setItem(paneKey, previousPane);
        if (previous === null) localStorage.removeItem(key);
        else localStorage.setItem(key, previous);
        window.fetch = originalFetch;
      }
    </script>
  </body>
</html>
