<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Monitoring Config — Synthetic UI E2E</title>
    <link rel="stylesheet" href="/styles/themes.css" />
    <link rel="stylesheet" href="/styles/searchable-dropdown.css" />
    <style>
      body {
        margin: 0;
        padding: 18px;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: system-ui, sans-serif;
      }
      #fixture-controls {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      #fixture-controls button {
        padding: 8px;
        cursor: pointer;
      }
      #root .mq-tool {
        height: calc(100dvh - 105px);
      }
    </style>
  </head>
  <body>
    <div id="fixture-controls">
      <strong>Synthetic UI fixture · no Oracle writes</strong><button id="theme">Switch Theme</button
      ><button id="remote">Simulate Remote Edit</button>
    </div>
    <div id="root"></div>
    <script type="module" src="./workspace.js"></script>
  </body>
</html>
