<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Checker presentation verification</title>
    <link rel="stylesheet" href="/styles/themes.css" />
    <link rel="stylesheet" href="/styles/buttons.css" />
    <link rel="stylesheet" href="/styles/overlays.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font: 15px system-ui;
      }
      nav {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      iframe {
        display: block;
        height: 1100px;
        max-width: 100%;
        border: 0;
      }
      #report {
        white-space: pre-wrap;
        font: 13px system-ui;
      }
      button {
        font: inherit;
      }
      @media (max-width: 600px) {
        body {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <script type="module">
      if (!new URLSearchParams(location.search).has("frame")) {
        document.body.innerHTML = `<nav aria-label="Verification viewport"><strong>Fixture verification</strong><button data-width="1366">Desktop</button><button data-width="768">Tablet</button><button data-width="390">Phone</button><button id="theme">Toggle theme</button><button id="replay">Replay check</button></nav><iframe title="Image Checker fixture" src="?frame" style="width:1366px"></iframe>`;
        document.querySelector("#replay").addEventListener("click", () => {
          document.querySelector("iframe").contentDocument.querySelector("#checkImageButton").click();
        });
        document.querySelectorAll("[data-width]").forEach((button) =>
          button.addEventListener("click", () => {
            document.querySelector("iframe").style.width = `${button.dataset.width}px`;
          }),
        );
        document.querySelector("#theme").addEventListener("click", () => {
          document.querySelector("iframe").contentDocument.documentElement.classList.toggle("dark");
        });
      } else {
        const { CheckImageTool } = await import("../main.js");
        const { UsageTracker } = await import("../../../core/UsageTracker.js");
        UsageTracker.trackEvent = UsageTracker.trackToolUse = () => {};
        document.body.innerHTML = '<div id="tool"></div><pre id="report" role="status"></pre>';
        const tool = new CheckImageTool();
        const envs = ["uat1", "uat2", "uat3", "akamai"].map((name) => ({ name, url: location.origin }));
        tool.baseUrlService.getAllUrls = () => envs;
        tool.saveValues = tool.loadSavedValues = tool.clearSavedValues = () => {};
        tool.mount(document.querySelector("#tool"));
        const paths = ["4aeeec01-9804-4d1a-87c9-80b3e11d8192", "8f6c2f1a-4f2d-4a8f-9b1e-0fd1a75b21c4"];
        tool.elements.batchImagePathsInput.value = paths.join("\n");
        tool.updateInputMeta();
        const run = tool.beginCheckRun();
        tool.renderProgressiveTable(paths, envs, run, [{ name: "UAT1 COMP" }, { name: "UAT2 COMP" }]);
        const image = new URL("./fixtures/wide.png", location.href).href;
        paths.forEach((path, row) =>
          envs.forEach((env, col) =>
            tool.updateCellWithResult(
              tool.root.querySelector(`#cell-${row}-${col}`),
              {
                exists: !(row === 0 && col === 2),
                url: image,
                width: 600,
                height: 337,
                aspectRatio: 1.78,
                sizeBytes: row === 0 && col === 0 ? 354450 : 115820,
                name: env.name,
              },
              path,
              env,
              row,
              col,
              run,
            ),
          ),
        );
        tool.root.querySelectorAll("[data-oracle-context]").forEach((el) => {
          el.textContent = "Debit Prioritas Sidomukti Chip";
        });
        tool.root.querySelectorAll("[data-oracle-size]").forEach((el) => {
          el.textContent = "154.45 KB";
        });
        tool.renderRunSummary(2, 4);
        tool.updateCheckButtonState();
        let probeIndex = 0;
        tool.getSelectedOracleConnections = () => [{ name: "UAT1 COMP" }, { name: "UAT2 COMP" }];
        tool.imageCheckerService.checkImage = async () => {
          const index = probeIndex++ % 8;
          await new Promise((resolve) => setTimeout(resolve, 3000));
          return { exists: index !== 2, url: image, width: 600, height: 337, sizeBytes: index === 0 ? 354450 : 115820 };
        };
        tool.fetchOracleMetadata = async () => {
          await new Promise((resolve) => setTimeout(resolve, 3500));
          tool.root.querySelectorAll("[data-oracle-context]").forEach((el) => {
            el.textContent = "Debit Prioritas Sidomukti Chip";
          });
          tool.root.querySelectorAll("[data-oracle-size]").forEach((el) => {
            el.textContent = "154.45 KB";
          });
        };
        const passed = [];
        const assert = (ok, label) => {
          if (!ok) throw new Error(label);
          passed.push(`PASS ${label}`);
        };
        try {
          assert(!tool.root.querySelector("#referenceLibrary, #referenceEditor, #savedReferencesButton"), "Saved-label feature removed");
          assert(
            tool.root.querySelectorAll(".batch-results-table > thead th").length === 5,
            "Main matrix contains only image ID and four CDN environments",
          );
          assert(tool.root.querySelector(".image-size-warning")?.textContent === "Over 300 KB", "CDN payload warning shown");
          tool.root.querySelector('[data-result-filter="issues"]').click();
          assert(
            [...tool.root.querySelectorAll(".image-result-row")].filter((row) => !row.hidden).length === 1,
            "Issues filter keeps the affected image",
          );
          assert(
            [...tool.root.querySelectorAll(".image-metadata-row")].filter((row) => !row.hidden).length === 1,
            "Oracle metadata follows its image filter",
          );
          tool.root.querySelector('[data-result-filter="all"]').click();
          tool.root.querySelector("summary").click();
          assert(tool.root.querySelector("details").open, "Oracle metadata expands inline");
          tool.root.querySelector(".status-preview-button").click();
          assert(
            document.querySelector(".image-details-modal").textContent.includes("354.45 KB · Over 300 KB"),
            "Preview overlay retains size alert",
          );
          document.querySelector(".close-modal-button").click();
          assert(document.documentElement.scrollWidth === document.documentElement.clientWidth, "No document-level horizontal overflow");
          document.querySelector("#report").textContent =
            `${passed.join("\n")}\nRESULT: ${passed.length} checks passed. CDN metadata and Oracle values are fixtures; preview is a local PNG.`;
        } catch (error) {
          document.querySelector("#report").textContent = `${passed.join("\n")}\nFAIL ${error.message}`;
        }
      }
    </script>
  </body>
</html>
