<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compare Config visual check</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>body { padding: 1rem; background: hsl(var(--background)); }</style>
  </head>
  <body>
    <script type="module">
      import { CompareConfigTemplate } from "./tools/compare-config/template.js";
      import { CompareConfigTool } from "./tools/compare-config/main.js";

      if (new URLSearchParams(location.search).has("dark")) document.documentElement.classList.add("dark");
      // The tool's custom properties (--font-mono, --results-viewport-chrome) live on its root
      // container, so the harness has to carry that class to render the surface faithfully.
      document.body.classList.add("compare-config-container");
      const shell = document.createElement("div");
      shell.innerHTML = CompareConfigTemplate;
      const section = shell.querySelector("#results-section");
      document.body.append(section);
      section.addEventListener("click", (event) => { section.dataset.clicked = event.target.className; });
      section.style.display = "flex";
      // In the app `is-reviewing` pins the card to the viewport; the harness has no shell around it,
      // so size the card directly or the flex results area collapses to zero height.
      section.style.height = "calc(100vh - 2rem)";
      const tool = new CompareConfigTool({ emit() {} });
      tool.bindEvents();
      const inspect = tool.gridView.onInspect;
      tool.gridView.onInspect = (index) => { section.dataset.inspected = String(index); inspect(index); };
      const attach = tool.gridView.attachEventListeners.bind(tool.gridView);
      tool.gridView.attachEventListeners = (container) => { section.dataset.attached = String(Boolean(container.querySelector('.excel-table'))); attach(container); };
      tool.queryMode = "unified";
      tool.unified.selectedPkFields = ["PARAMETER_KEY"];
      const jsonA = JSON.stringify({ loanMultiplier: "1", isNeedSpouse: "0", isNeedSpouseInfo: "1", adminValue: "1", feeThreshold: "1", categoryContent: "1", rule: { enabled: true, days: 180 } });
      const jsonB = JSON.stringify({ loanMultiplier: "1", isNeedSpouse: "1", isNeedSpouseInfo: "1", adminValue: "1", feeThreshold: "1", categoryContent: "1", rule: { enabled: true, days: 365 } });
      tool.results.unified = {
        env1_name: "(UAT1 COMP) SQL Query",
        env2_name: "(PREPROD COMP) SQL Query",
        summary: { total: 4, matches: 1, differs: 2, only_in_env1: 1, only_in_env2: 0 },
        _metadata: { keyColumns: ["PARAMETER_KEY"], compareFields: ["PARAMETER_VALUE"], sourceLimits: [{ name: "UAT1 COMP", rowCount: 500, maxRows: 500 }] },
        rows: [
          { key: { PARAMETER_KEY: "loan.deposito.whitelist.lov" }, env1_data: { PARAMETER_VALUE: jsonA }, env2_data: { PARAMETER_VALUE: jsonB }, status: "differ", differences: ["PARAMETER_VALUE"] },
          { key: { PARAMETER_KEY: "renewal.loan.deposito.end.days" }, env1_data: { PARAMETER_VALUE: "180" }, env2_data: { PARAMETER_VALUE: "365" }, status: "differ", differences: ["PARAMETER_VALUE"] },
          { key: { PARAMETER_KEY: "early.settlement.service.failed" }, env1_data: { PARAMETER_VALUE: "CONFIG_ONLY_IN_UAT" }, env2_data: null, status: "only_in_env1", differences: ["PARAMETER_VALUE"] },
          { key: { PARAMETER_KEY: "same.value" }, env1_data: { PARAMETER_VALUE: "on" }, env2_data: { PARAMETER_VALUE: "on" }, status: "match", differences: [] },
        ],
      };
      if (new URLSearchParams(location.search).has("composite")) {
        tool.results.unified._metadata.keyColumns = ["SERVICE_CODE", "ENVIRONMENT"];
        tool.results.unified.rows.forEach((row) => {
          row.key = { SERVICE_CODE: row.key.PARAMETER_KEY, ENVIRONMENT: "PROD" };
        });
      }
      if (new URLSearchParams(location.search).has("buyback")) {
        const velocity = [
          "#set($goldPriceResponse = $!velocityContext.rawResponseFromRespectiveService)",
          "#set($listHelper = $fn.listHelper()) ## Livin Configurable",
          '#set($partnerId = "6373020268312772")',
          '#set($targetSeriesId = "7")',
          '#set($colorHexCode = "#E69F00")',
          "## Filter Processing",
          '#set($matchedSeries = $listHelper.filterObjectList($goldPriceResponse.get("data"), "series_id", "eq", $targetSeriesId))',
          "#set($selectedPrices = $listHelper.emptyList())",
          "#if($matchedSeries && $matchedSeries.size() > 0)",
          "  #set($selectedSeries = $matchedSeries.get(0))",
          "  #set($selectedPrices = $listHelper.filterObjectList($selectedSeries.get(\"prices\"), \"weight_in_grams\", \"gt\", \"0\"))",
          "#end",
          "{",
          '  "responseTemplate": {',
          '    "partnerId": "$!partnerId",',
          '    "colorHexCode": "$!colorHexCode",',
          '    "buyBackPrices": [',
          "      #foreach($price in $selectedPrices)",
          "        #if($foreach.hasNext),#end",
          "        {",
          '          "weightInGrams": $price.get("gramasi"),',
          '          "pricePerUnit": $price.get("buyback_price")',
          "        }",
          "      #end",
          "    ]",
          "  }",
          "}",
        ].join("\n");
        const velocityChanged = velocity
          .replace('"6373020268312772"', '"3490020274031638"')
          .replace('"#E69F00"', '"#B38000"');
        const changedFields = ["SQL_QUERY", "RESP_MAP_TEMPLATE", "COLOR_HEX_CODE"];
        tool.results.unified.env1_name = "(UAT1 COMP) SQL Query";
        tool.results.unified.env2_name = "(UAT2 COMP) SQL Query";
        tool.results.unified._metadata.keyColumns = ["SERVICE_CODE", "ENVIRONMENT"];
        tool.results.unified._metadata.compareFields = changedFields;
        tool.results.unified.rows = [
          {
            key: { SERVICE_CODE: "3490020274031638-gold-portfolio-buyback-price", ENVIRONMENT: "BETA" },
            env1_data: {
              SQL_QUERY: velocity,
              RESP_MAP_TEMPLATE: velocity,
              COLOR_HEX_CODE: "#E69F00",
              CACHE_TTL_SECONDS: "120",
            },
            env2_data: {
              SQL_QUERY: velocityChanged,
              RESP_MAP_TEMPLATE: velocityChanged,
              COLOR_HEX_CODE: "#B38000",
              CACHE_TTL_SECONDS: "120",
            },
            status: "differ",
            differences: changedFields,
          },
          {
            key: { SERVICE_CODE: "3490020274031638-gold-portfolio-sellback-price", ENVIRONMENT: "BETA" },
            env1_data: { SQL_QUERY: velocity, RESP_MAP_TEMPLATE: velocity, COLOR_HEX_CODE: "#E69F00", CACHE_TTL_SECONDS: "60" },
            env2_data: { SQL_QUERY: velocity, RESP_MAP_TEMPLATE: velocity, COLOR_HEX_CODE: "#B38000", CACHE_TTL_SECONDS: "120" },
            status: "differ",
            differences: ["COLOR_HEX_CODE", "CACHE_TTL_SECONDS"],
          },
          {
            key: { SERVICE_CODE: "3490020274031638-gold-portfolio-buyback-fee", ENVIRONMENT: "PROD" },
            env1_data: null,
            env2_data: { SQL_QUERY: velocityChanged, RESP_MAP_TEMPLATE: velocityChanged, COLOR_HEX_CODE: "#B38000" },
            status: "only_in_env2",
            differences: [],
          },
          {
            key: { SERVICE_CODE: "3490020274031638-gold-portfolio-buyback-limit", ENVIRONMENT: "BETA" },
            env1_data: { SQL_QUERY: velocity, RESP_MAP_TEMPLATE: velocity, COLOR_HEX_CODE: "#E69F00", CACHE_TTL_SECONDS: "120" },
            env2_data: { SQL_QUERY: velocity, RESP_MAP_TEMPLATE: velocity, COLOR_HEX_CODE: "#E69F00", CACHE_TTL_SECONDS: "120" },
            status: "match",
            differences: [],
          },
        ];
        tool.results.unified.summary = { total: 4, matches: 1, differs: 2, only_in_env1: 0, only_in_env2: 1 };
        if (new URLSearchParams(location.search).has("wide")) {
          const manyFields = [
            "SQL_QUERY",
            "RESP_MAP_TEMPLATE",
            "COLOR_HEX_CODE",
            "CACHE_TTL_SECONDS",
            "NOTIFICATION_TEMPLATE",
            "RETRY_BACKOFF_POLICY",
            "IDEMPOTENCY_KEY_HEADER",
            "PARTNER_OVERRIDE_MAP",
          ];
          tool.results.unified._metadata.compareFields = manyFields;
          tool.results.unified.rows.unshift({
            key: { SERVICE_CODE: "3490020274031638-gold-portfolio-buyback-price", ENVIRONMENT: "BETA" },
            env1_data: Object.fromEntries(manyFields.map((field, index) => [field, `value-${index}\nsecond-${index}`])),
            env2_data: Object.fromEntries(manyFields.map((field, index) => [field, `value-${index}\nchanged-${index}`])),
            status: "differ",
            differences: manyFields,
          });
          tool.results.unified.summary = { total: 5, matches: 1, differs: 3, only_in_env1: 0, only_in_env2: 1 };
        }
      }
      if (new URLSearchParams(location.search).has("long")) {
        const lines = Array.from({ length: 120 }, (_, index) => `#set($value${index} = ${index})`);
        const original = lines.join("\n");
        const changed = lines.map((line, index) => index === 60 ? "#set($value60 = changed)" : line).join("\n");
        tool.results.unified.rows = Array.from({ length: 203 }, (_, index) => ({
          key: { SERVICE_CODE: `service-${index + 1}`, ENVIRONMENT: "BETA" },
          env1_data: { PARAMETER_VALUE: original },
          env2_data: { PARAMETER_VALUE: changed },
          status: "differ",
          differences: ["PARAMETER_VALUE"],
        }));
        tool.results.unified.summary = { total: 203, matches: 0, differs: 203, only_in_env1: 0, only_in_env2: 0 };
        tool.results.unified._metadata.keyColumns = ["SERVICE_CODE", "ENVIRONMENT"];
      }
      section.querySelector("#results-title").textContent =
        `${tool.gridView.formatEnvName(tool.results.unified.env1_name)} vs ${tool.gridView.formatEnvName(tool.results.unified.env2_name)}`;
      tool.renderSummary();
      section.dataset.renderStep = "summary";
      tool.renderResults();
      section.dataset.renderStep = "results";
      section.dataset.hasInspect = typeof tool.gridView.onInspect;
      section.querySelector('table')?.addEventListener('click', (event) => { section.dataset.tableClick = event.target.className; });
      window.previewTool = tool;
    </script>
  </body>
</html>
