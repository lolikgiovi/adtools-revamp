<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>AD Tools verification code</title>
    <style>
      body {
        color: #112d40;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
      @media (max-width: 480px) {
        .pad {
          padding: 28px 22px !important;
        }
        .digits {
          font-size: 42px !important;
          letter-spacing: 6px !important;
        }
        .outer {
          padding: 20px 12px !important;
        }
        h1 {
          font-size: 28px !important;
        }
      }
    </style>
  </head>
  <body class="ground" style="margin: 0; background-color: #eaf0f4">
    <div style="display: none; max-height: 0; overflow: hidden">Your AD Tools verification code is 123456. Expires in 30 minutes.</div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      class="ground"
      bgcolor="#eaf0f4"
      style="width: 100%; background-color: #eaf0f4"
    >
      <tr>
        <td class="outer" align="center" style="padding: 40px 20px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            class="sheet"
            bgcolor="#ffffff"
            style="width: 100%; max-width: 480px; background-color: #ffffff; border-radius: 16px"
          >
            <tr>
              <td class="pad" style="text-align: center; padding: 36px">
                <p class="accent" style="margin: 0 0 36px; color: #1d577b; font-size: 19px; line-height: 24px; font-weight: 700">
                  AD Tools
                </p>
                <h1
                  class="ink"
                  style="margin: 0 0 14px; color: #112d40; font-size: 30px; line-height: 1.15; letter-spacing: -0.8px; font-weight: 700"
                >
                  You’re almost in.
                </h1>
                <p class="muted" style="margin: 0 0 28px; color: #4b6272; font-size: 16px; line-height: 1.6">
                  Enter this code to verify your email<br />and continue to AD Tools.
                </p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      class="panel"
                      align="center"
                      bgcolor="#163e58"
                      style="background-color: #163e58; padding: 38px 12px; border-radius: 12px"
                    >
                      <div
                        class="digits"
                        style="
                          color: #ffffff;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 48px;
                          line-height: 1.2;
                          font-weight: 700;
                          letter-spacing: 8px;
                          font-variant-numeric: tabular-nums;
                          user-select: all;
                          -webkit-user-select: all;
                        "
                      >
                        123456
                      </div>
                    </td>
                  </tr>
                </table>
                <p class="ink" style="margin: 18px 0 0; color: #112d40; font-size: 15px; line-height: 24px">
                  Expires in <strong>30 minutes.</strong>
                </p>
                <p class="muted" style="margin: 4px 0 0; color: #4b6272; font-size: 14px; line-height: 23px">Select the code to copy it.</p>
                <p class="muted" style="margin: 34px 0 0; color: #4b6272; font-size: 14px; line-height: 23px">
                  Didn’t request this code? You can ignore this email. Keep your code private.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
